<!DOCTYPE html>
<html>
  <head>
    <title>Workout Planner</title>
    <meta name="description" content="A Catalog of Workouts" />
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="scripts.js"></script>
    <link rel="icon" href="Assets\pageIcon.png" />
  </head>

  <body>
    <header class="main-header">
      <h1 class="title">Workout Planner</h1>
      <input type="text" id="searchInput" placeholder="Search workouts..." />

      <button onclick="quoteAlert();">Get Motivation!</button>
    </header>

    <div class="sidebar">
      <div class="filters">
        <label
          ><input type="checkbox" id="bodyWeightCheckbox" /> Body Weight</label
        >
        <label><input type="checkbox" id="bicepCheckbox" /> Bicep</label>
        <label><input type="checkbox" id="tricepCheckbox" /> Tricep</label>
        <label><input type="checkbox" id="shoulderCheckbox" /> Shoulder</label>
        <label><input type="checkbox" id="chestCheckbox" /> Chest</label>
        <label><input type="checkbox" id="backCheckbox" /> Back</label>
        <label><input type="checkbox" id="legCheckbox" /> Leg</label>
        <label><input type="checkbox" id="absCheckbox" /> Abs</label>
        <label><input type="checkbox" id="compoundCheckbox" /> Compound</label>
        <button onclick="showAllWorkout();">All Workouts</button>
      </div>
      <hr class="horizontalLine" />
      <div class="todaysWorkout">
        <h3 class="centeredTexts">Today's Workout:</h3>
        <button onclick="todaysWorkout();">Today's Workout</button>
        <button onclick="removeFirstCard();">Remove Workout</button>
        <button
          onclick="randomizeWorkouts();"
          class="randomize-button"
          style="display: block"
        >
          Randomize
        </button>
        <h3 class="centeredTexts">0/6 Complete</h3>
      </div>
    </div>

    <div id="card-container"></div>
    <div class="card" style="display: none">
      <div class="card-content">
        <img src="" alt="Workout Poster" />
        <h2>Workouts</h2>
        <ul></ul>
      </div>
    </div>
    <div class="footer"></div>
  </body>
</html>
