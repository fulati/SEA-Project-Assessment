<!DOCTYPE html>
<html>
  <head>
    <title>Workout Planner</title>
    <meta name="description" content="A Catalog of Workouts" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="Assets\pageIcon.png" />
    <script type="module" src="workouts.js"></script>
    <script type="module" src="quotes.js"></script>
    <script type="module" src="scripts.js"></script>
  </head>

  <body>
    <!-- Header -->
    <header class="main-header">
      <h1 class="title">Workout Planner</h1>
      <input type="text" id="searchInput" placeholder="Search workouts..." />

      <button id="getMotivationButton">Get Motivation!</button>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Checkboxes -->
      <div class="filters">
        <h3 class="centeredTexts">Muscles:</h3>

        <label
          ><input type="checkbox" id="bicepCheckbox" value="Biceps" />
          Biceps</label
        >
        <label
          ><input type="checkbox" id="tricepCheckbox" value="Triceps" />
          Triceps</label
        >
        <label
          ><input type="checkbox" id="shoulderCheckbox" value="Shoulders" />
          Shoulders</label
        >
        <label
          ><input type="checkbox" id="chestCheckbox" value="Chest" />
          Chest</label
        >
        <label
          ><input type="checkbox" id="backCheckbox" value="Back" /> Back</label
        >
        <label
          ><input type="checkbox" id="legCheckbox" value="Legs" /> Legs</label
        >
        <label
          ><input type="checkbox" id="absCheckbox" value="Abs" /> Abs</label
        >
        <h4 id="furtherFilterText">--Further Filter--</h4>
        <label
          ><input type="checkbox" id="bodyWeightCheckbox" value="Body Weight" />
          Body Weight</label
        >
        <label
          ><input type="checkbox" id="compoundCheckbox" value="Compound" />
          Compound Workouts</label
        >
        <button id="showAllWorkoutButton">Show All Workouts</button>
      </div>
      <hr class="horizontalLine" />
      <!-- Today's Workout -->
      <div class="todaysWorkout">
        <h3 class="centeredTexts">Today's Workout:</h3>
        <button id="todaysWorkoutButton">Today's Workout</button>
        <button id="removeWorkoutButton">Remove First Workout</button>
        <h3 class="centeredTexts" id="completedWorkoutText">0/6 Complete</h3>
      </div>
    </div>

    <!-- Motivation Popup -->
    <div id="motivationPopUp" class="popup">
      <div class="popUp-content">
        <img id="closeButton" src="Assets\closeBtn.png" alt="close button" />
        <p id="quote"></p>
      </div>
    </div>

    <!-- Card Container -->
    <div id="card-container"></div>

    <!-- Card Template -->
    <div class="card" style="display: none">
      <div class="card-content">
        <img class="workoutGif" src="" alt="Workout Poster" />
        <h2>Workouts</h2>
        <ul></ul>
      </div>
    </div>
    <div class="footer"></div>
  </body>
</html>
